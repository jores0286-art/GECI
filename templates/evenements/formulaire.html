{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GECI - Nouvel événement</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- Barre latérale -->
    <aside class="sidebar">

        <div class="logo">
            GECI
        </div>

        <ul class="menu">

            <li>
                <a href="{% url 'accueil' %}">🏠 Accueil</a>
            </li>

            <li>
                <a href="{% url 'liste_evenements' %}">📅 Événements</a>
            </li>

            <li>
                <a href="#">📢 Annonces</a>
            </li>

            <li>
                <a href="#">🔔 Notifications</a>
            </li>

            <li>
                <a href="#">👥 Utilisateurs</a>
            </li>

            <li>
                <a href="#">📊 Statistiques</a>
            </li>

            <li>
                <a href="#">⚙️ Paramètres</a>
            </li>

        </ul>

    </aside>


    <!-- Contenu principal -->
    <main class="contenu">

        <div class="topbar">

            <div>
                <h1>Nouvel événement</h1>
                <p>Créer un nouvel événement</p>
            </div>

        </div>


        <section class="formulaire">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="bouton-ajouter">
                    Enregistrer l'événement
                </button>

                <a href="{% url 'liste_evenements' %}">
                    Annuler
                </a>

            </form>

        </section>

    </main>

</body>

</html>
